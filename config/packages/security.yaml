security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        login:
            pattern: ^/api/auth/login
            stateless: true

        product : 
            pattern: ^/api/product
            stateless : true
            methods : GET

        avis : 
            pattern: ^/api/avis
            stateless : true
            methods : GET

        categorie : 
            pattern: ^/api/categorie
            stateless : true
            methods : GET
        
        subCategorie : 
            pattern: ^/api/subCategorie
            stateless : true
            methods : GET

        passport : 
            pattern: ^/api/auth/passport
            stateless : true
        #     json_login:
        #         check_path: /api/login
        #         success_handler: lexik_jwt_authentication.handler.authentication_success
        #         failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/passport, roles: PUBLIC_ACCESS }
        - { path: ^/api/product, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/avis, roles: PUBLIC_ACCESS, methods: [POST,PUT] }
        - { path: ^/api/product, roles: "ROLE_ADMIN", methods: [POST,PUT] }
        - { path: ^/api/categorie, roles: PUBLIC_ACCESS, methods: [GET]  }
        - { path: ^/api/categorie, roles: "ROLE_ADMIN", methods: POST  }
        - { path: ^/api/subCategorie, roles: PUBLIC_ACCESS, methods: [GET]  }
        - { path: ^/api/subCategorie, roles: "ROLE_ADMIN", methods: [POST,PUT] }
        #- { path: ^/api, roles: ROLE_ADMIN }